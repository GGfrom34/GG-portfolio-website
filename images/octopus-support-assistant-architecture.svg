<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Architecture of the Octopus Support Assistant's live web chat demo</title>
  <desc>You ask a question in the chat widget on this page, in your browser. The widget calls the web chat server hosted on Render, which enforces guardrails and calls core.py, the shared assistant logic. core.py always classifies the message first, then either fetches Octopus Energy's public help pages and asks Claude to draft an answer grounded only in that fetched text, or returns a fixed redirect message for anything account-specific or a dispute. When neither the account/dispute boundary nor a grounded answer applies, that is a genuine content gap: the question is redacted and logged as a Jira issue for review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="300" y="30" width="160" height="50" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="380" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2c2a">You</text>
  <text x="380" y="66" text-anchor="middle" font-size="12" fill="#5f5e5a">Asking a question</text>

  <line x1="380" y1="80" x2="380" y2="106" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="106" width="220" height="54" rx="4" fill="#eaf3de" stroke="#639922" stroke-width="0.5"/>
  <text x="380" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#173404">Chat widget</text>
  <text x="380" y="144" text-anchor="middle" font-size="12" fill="#27500a">This page, in your browser</text>

  <line x1="380" y1="160" x2="380" y2="196" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="392" y="182" text-anchor="start" font-size="12" fill="#5f5e5a">Over the internet</text>

  <rect x="60" y="196" width="640" height="120" rx="6" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="380" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2c2a">Render</text>
  <text x="380" y="234" text-anchor="middle" font-size="12" fill="#5f5e5a">Everything runs in the cloud</text>

  <rect x="90" y="250" width="220" height="50" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="200" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#26215c">Web chat server</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#3c3489">FastAPI + guardrails</text>

  <rect x="390" y="250" width="220" height="50" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="500" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#04342c">core.py</text>
  <text x="500" y="288" text-anchor="middle" font-size="12" fill="#085041">Classify, then route</text>

  <line x1="310" y1="275" x2="390" y2="275" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <line x1="460" y1="300" x2="160" y2="358" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="380" y2="358" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="300" x2="600" y2="358" stroke="#5c5c5c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="380" y="335" text-anchor="middle" font-size="12" fill="#5f5e5a">Over the internet</text>

  <rect x="60" y="358" width="200" height="54" rx="4" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="160" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#042c53">Anthropic API</text>
  <text x="160" y="396" text-anchor="middle" font-size="12" fill="#0c447c">Classify, ground, redact</text>

  <rect x="280" y="358" width="200" height="54" rx="4" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="380" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1b0c">Octopus help pages</text>
  <text x="380" y="396" text-anchor="middle" font-size="12" fill="#712b13">Public, fetched live</text>

  <rect x="500" y="358" width="200" height="54" rx="4" fill="#fdf3d9" stroke="#a07a12" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="600" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3607">Jira</text>
  <text x="600" y="396" text-anchor="middle" font-size="12" fill="#6b5310">Content gaps only</text>
</svg>
