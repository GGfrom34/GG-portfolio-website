<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Architecture of the Octopus Tariff Advisor's live web chat demo</title>
  <desc>You ask a question in the chat widget on this page, in your browser. The widget calls the web chat server hosted on Render, which enforces guardrails and talks to Claude over the Anthropic API in a tool-use loop. When Claude calls a tool, the same shared tariff engine (core.py) runs and fetches live rates from the public Octopus Energy API. The reply streams back through Render to the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="260" y="40" width="160" height="50" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2c2a">You</text>
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="#5f5e5a">Asking a question</text>

  <line x1="340" y1="90" x2="340" y2="118" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="118" width="220" height="54" rx="4" fill="#eaf3de" stroke="#639922" stroke-width="0.5"/>
  <text x="340" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#173404">Chat widget</text>
  <text x="340" y="156" text-anchor="middle" font-size="12" fill="#27500a">This page, in your browser</text>

  <line x1="340" y1="172" x2="340" y2="208" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="352" y="194" text-anchor="start" font-size="12" fill="#5f5e5a">Over the internet</text>

  <rect x="80" y="208" width="520" height="130" rx="6" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2c2a">Render</text>
  <text x="340" y="246" text-anchor="middle" font-size="12" fill="#5f5e5a">Everything runs in the cloud</text>

  <rect x="110" y="262" width="220" height="50" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="220" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#26215c">Web chat server</text>
  <text x="220" y="300" text-anchor="middle" font-size="12" fill="#3c3489">FastAPI + guardrails</text>

  <rect x="350" y="262" width="220" height="50" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="460" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#04342c">Tariff engine</text>
  <text x="460" y="300" text-anchor="middle" font-size="12" fill="#085041">core.py, shared logic</text>

  <line x1="330" y1="287" x2="350" y2="287" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <line x1="220" y1="312" x2="220" y2="378" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="460" y1="312" x2="460" y2="378" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="230" y="362" text-anchor="start" font-size="12" fill="#5f5e5a">Over the internet</text>
  <text x="470" y="362" text-anchor="start" font-size="12" fill="#5f5e5a">Over the internet</text>

  <rect x="110" y="378" width="220" height="50" rx="4" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="220" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#042c53">Anthropic API</text>
  <text x="220" y="416" text-anchor="middle" font-size="12" fill="#0c447c">Claude, tool-use loop</text>

  <rect x="350" y="378" width="220" height="50" rx="4" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="460" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1b0c">Octopus Energy API</text>
  <text x="460" y="416" text-anchor="middle" font-size="12" fill="#712b13">Public data, read-only</text>
</svg>
