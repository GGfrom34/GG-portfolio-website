<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Architecture of the PRD-to-Jira workflow</title>
  <desc>You provide a draft PRD. The prd-quality-reviewer subagent reads it and reports quality gaps, and the improve-prd skill fixes them inline with your sign-off on each edit, looping with the reviewer until the PRD is clean. You then give the first sign-off: the PRD is final. The jira-epic-builder subagent confirms the target Jira project and proposes an Epic plus Story and Task breakdown. You give the second sign-off: the breakdown is approved. Only then does it create the Epic and its issues in Jira Cloud via Atlassian's official remote MCP server, reading everything back afterwards to verify the links actually took.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="240" y="30" width="200" height="50" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#2c2c2a">You</text>
  <text x="340" y="68" text-anchor="middle" font-size="12" fill="#5f5e5a">Provide a draft PRD</text>

  <line x1="340" y1="80" x2="340" y2="108" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="108" width="300" height="54" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="340" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#26215c">prd-quality-reviewer</text>
  <text x="340" y="146" text-anchor="middle" font-size="12" fill="#3c3489">Read-only subagent — reports gaps</text>

  <line x1="340" y1="162" x2="340" y2="190" stroke="#5c5c5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="352" y="180" text-anchor="start" font-size="11" fill="#5f5e5a">Review &#8644; fix, until clean</text>

  <rect x="190" y="190" width="300" height="54" rx="4" fill="#eaf3de" stroke="#639922" stroke-width="0.5"/>
  <text x="340" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#173404">improve-prd skill</text>
  <text x="340" y="228" text-anchor="middle" font-size="12" fill="#27500a">Inline in chat — you approve each edit</text>

  <line x1="340" y1="244" x2="340" y2="272" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="272" width="300" height="50" rx="4" fill="#fff8e6" stroke="#b98900" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="340" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4400">PRD sign-off</text>
  <text x="340" y="310" text-anchor="middle" font-size="12" fill="#8a6400">You decide it's ready to build from</text>

  <line x1="340" y1="322" x2="340" y2="350" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="350" width="300" height="54" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="340" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#26215c">jira-epic-builder</text>
  <text x="340" y="388" text-anchor="middle" font-size="12" fill="#3c3489">Confirms project, proposes Epic + issues</text>

  <line x1="340" y1="404" x2="340" y2="432" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="432" width="300" height="50" rx="4" fill="#fff8e6" stroke="#b98900" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="340" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4400">Breakdown sign-off</text>
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#8a6400">You approve the Epic / issue split</text>

  <line x1="340" y1="482" x2="340" y2="510" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="510" width="300" height="70" rx="4" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="340" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#042c53">Jira Cloud</text>
  <text x="340" y="551" text-anchor="middle" font-size="12" fill="#0c447c">Epic + Story/Task issues</text>
  <text x="340" y="567" text-anchor="middle" font-size="12" fill="#0c447c">via Atlassian's remote MCP server</text>
</svg>
